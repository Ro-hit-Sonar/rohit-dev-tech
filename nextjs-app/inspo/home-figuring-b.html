<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What I'm figuring out — section</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>
:root{
  --sans:"Helvetica Neue","Inter",Helvetica,Arial,sans-serif;
  --paper:#F2F2F0;
  --ink:#0F0F0E;
  --prose:#2B2B27;
  --ink-2:#61615B;
  --ink-3:#A2A29B;
  --rule:#DCDCD6;
  --rule-faint:#E6E6E0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D0D0C;--ink:#F2F2EE;--prose:#CBCBC4;
    --ink-2:#8C8C86;--ink-3:#62625D;--rule:#242422;--rule-faint:#1C1C1A;
  }
}
:root[data-theme="dark"]{
  --paper:#0D0D0C;--ink:#F2F2EE;--prose:#CBCBC4;
  --ink-2:#8C8C86;--ink-3:#62625D;--rule:#242422;--rule-faint:#1C1C1A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{font-family:var(--sans);font-weight:400;color:var(--ink);-webkit-font-smoothing:antialiased}
.label{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wrap{max-width:1300px;margin:0 auto;padding:0 clamp(20px,4.4vw,72px)}

/* ── section shell: the same boundary + header row every other
   section on the site uses. This is what makes it belong. ─────── */
.figuring{
  position:relative;overflow:hidden;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  padding:clamp(44px,5vw,78px) 0 clamp(30px,3.4vw,46px);
}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:24px;margin-bottom:clamp(40px,5vw,72px);position:relative;z-index:1}

/* ── rings: the site's own circle construction — concentric,
   anchored to a node, cropped by the edge. Not a loose spiral. ── */
.orbits{
  position:absolute;z-index:0;pointer-events:none;
  right:-200px;top:50%;transform:translateY(-50%);
  width:900px;height:900px;
}
.orbits svg{width:100%;height:100%;display:block}
.orbits circle{fill:none;stroke:var(--rule);stroke-width:1}
.orbits .core{fill:var(--ink);stroke:none}
.orbits .mark{fill:var(--ink-3);stroke:none}
.orbits path{fill:none;stroke:var(--rule);stroke-width:1}


/* ── copy: headline and paragraph share ONE left edge ─────────── */
.copy{position:relative;z-index:1}
.head{
  margin:0;font-weight:400;
  font-size:clamp(2.05rem,4.4vw,3.8rem);
  line-height:1.05;letter-spacing:-.036em;
}
.head span{display:block}
/* answers hollow, questions solid — the type states the thesis */
.hollow{
  font-style:normal;color:transparent;
  -webkit-text-stroke:1.5px var(--ink-3);
}
@supports not ((-webkit-text-stroke:1px red)){.hollow{color:var(--ink-3)}}
.quiet{color:var(--ink-2)}
.say{
  margin:clamp(30px,3.4vw,46px) 0 0;
  font-size:clamp(1rem,1.15vw,1.11rem);
  line-height:1.72;color:var(--prose);
  max-width:52ch;text-wrap:pretty;
}


@media (max-width:1000px){
  .orbits{right:-460px;opacity:.6}
  .copy{max-width:none}
}
</style>
</head>
<body>

<section class="figuring">
  <div class="orbits" aria-hidden="true">
    <svg viewBox="0 0 900 900">
      <circle cx="450" cy="450" r="143"/>
      <circle cx="498" cy="418" r="245"/>
      <circle cx="546" cy="386" r="347"/>
      <circle cx="594" cy="354" r="449"/>
      <circle class="core" cx="450" cy="450" r="5.5"/>
      <circle class="mark" cx="498" cy="418" r="3.4"/>
      <circle class="mark" cx="546" cy="386" r="3.4"/>
      <circle class="mark" cx="594" cy="354" r="3.4"/>
    </svg>
  </div>

  <div class="wrap">
    <div class="sec-h">
      <span class="label">What I'm figuring out</span>
    </div>

    <div class="copy">
      <h1 class="head">
        <span class="quiet">Less about having <em class="hollow">answers</em>.</span>
        <span>More about exploring</span>
        <span>better questions.</span>
      </h1>

      <p class="say">The work sits around software engineering, AI, and the ideas that connect them. Some projects become products, some become experiments, and some simply become lessons worth sharing.</p>
    </div>

  </div>
</section>

</body>
</html>
